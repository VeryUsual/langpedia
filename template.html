<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

.topnav {
  overflow: hidden;
  background-color: #333;
  position: fixed;
  width: 100%;
}

.topnav a {
  float: left;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 17px;
}

.topnav a:hover {
  background-color: #ddd;
  color: black;
}

.topnav a.active {
  background-color: #04AA6D;
  color: white;
}

.sidenav {
  height: 100%;
  width: 160px;
  position: fixed;
  top: 0;
  left: 0;
  background-color: #111;
  overflow-x: hidden;
  padding-top: 20px;
  margin-top: 48px;
}

.sidenav a {
  padding: 6px 8px 6px 16px;
  text-decoration: none;
  font-size: 25px;
  color: #818181;
  display: block;
}

.sidenav a:hover {
  color: #f1f1f1;
}

.main {
  margin-left: 160px;
  padding: 0px 10px;
  padding-left:16px;
}

@media screen and (max-height: 450px) {
  .sidenav {padding-top: 15px;}
  .sidenav a {font-size: 18px;}
}

.rightbox img {
  max-height: 40vh;
}

.rightbox {
  text-align: center;
}

p {
  line-height: 150%;
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/default.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/darkmode-js@1.5.7/lib/darkmode-js.min.js"></script>
</head>
<body>

<div class="sidenav">{{sidebar}}</div>

<div class="topnav">
  <a href="{{ROOT}}">Home</a>
  <button style="float:right;font-size:15px;" onclick="translateTxt()">Translate</button>
</div>

<div class="main">
    <br><br>
    {{content}}
</div>

<script>
var current_lang = "en";

hljs.highlightAll();

function addDarkmodeWidget() {
  const options = {
    autoMatchOsTheme: false
  }

  new Darkmode(options).showWidget();
}
window.addEventListener('load', addDarkmodeWidget);

function translateTxt() {
  const lang = prompt("What language would you like the content to be translated to (use the TWO LETTER code for it, for example, en, fr, es, etc)?");
  const old_lang = current_lang;

  document.querySelectorAll("p").forEach(elem => {
    const req = new XMLHttpRequest();
    req.onreadystatechange = function() {
      if (this.readyState == 4 && this.status == 200) {
        elem.textContent = JSON.parse(this.responseText)["translated-text"];
        current_lang = lang;
      }
    }
    req.open(
      "GET",
      "https://mozhi.pussthecat.org/api/translate?engine=google&from=" + 
        old_lang + "&to=" + 
        lang + "&text=" + encodeURIComponent(elem.textContent)
      );
    req.send();
  });
}
</script>

</body>
</html>
